<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Whitewater Rafting for reservations, customer service, and website support.">
    <meta name="author" content="Werner Eduard Moecke">
    <link rel="stylesheet" href="./styles/rafting.css?v=2">
    <title>Contact Us - Whitewater Rafting</title>
</head>

<body>
    <header>
        <img src="./images/wwr-logo.png" alt="WWR Logo" />
        <nav>
            <a href="index.html"> Home</a>
            <a href="about.html"> About Us</a>
            <a href="trips.html"> Trips</a>
            <a href="contact.html"> Contact Us</a>
        </nav>
    </header>
    <main class="contact-page">
        <section class="contact-top">
            <h2>White Water Rafting Company</h2>
            <address>
                123 Main River Street<br>
                Kolob, California<br>
                +1 999 999 9999<br>
                info@whitewater.com
            </address>
        </section>
        <section class="contact-grid">
            <div class="contact-details">
                <div class="map-container">
                    <iframe
                      src="https://maps.google.com/maps?q=123%20Main%20River%20Street%2C%20Kolob%2C%20CA&z=14&output=embed"
                      title="White Water Rafting location" loading="lazy"
                      referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
            <div class="contact-form">
                <form>
                    <div class="form-row horizontal">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Placeholder" required>
                    </div>

                    <div class="form-row horizontal">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Placeholder"
                          required>
                    </div>

                    <div class="form-row horizontal purpose-row">
                        <label>Message Purpose</label>
                        <div class="radio-group">
                            <label><input type="radio" name="purpose" checked> General
                                Inquiry</label>
                            <label><input type="radio" name="purpose"> Reservation Question</label>
                            <label><input type="radio" name="purpose"> Website Suggestion</label>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Type here"></textarea>
                    </div>

                    <div class="checkbox-row">
                        <label>
                            <input type="checkbox" name="subscribe" checked>
                            Please Subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit" class="submit-button">Get in Touch!</button>
                </form>
            </div>
        </section>
        <section class="staff-profiles">
            <h2>We Are Here to Serve You</h2>
            <div class="profile-grid">
                <figure>
                    <img src="./images/employee.png" alt="Employee 1 profile">
                    <figcaption>Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="./images/employee.png" alt="Employee 2 profile">
                    <figcaption>Customer Service Lead</figcaption>
                </figure>
                <figure>
                    <img src="./images/employee.png" alt="Employee 3 profile">
                    <figcaption>Reservation Specialist</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Whitewater Rafting Werner Eduard Moecke</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="./images/facebook_icon.svg" alt="Facebook Icon" />
            </a>
            <a href="https://linkedin.com">
                <img src="./images/li_icon.svg" alt="LI Logo" />
            </a>
            <a href="http://instagram.com">
                <img src="./images/instagram_icon.svg" alt="Instagram Icon" />
            </a>
        </nav>
    </footer>
</body>

</html>
